# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.local-db.yml up --build
#
# No hace falta Atlas: Mongo corre en el contenedor pathway-mongo.

services:
  api:
    environment:
      MONGODB_URI: mongodb://mongo:27017/pathway
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: pathway-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - pathway_mongo:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  pathway_mongo:
